<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">ScopeThread Managed MCP audit evidence</title>
  <desc id="description">A read-only audit visual showing the successful agent run, decision revision chain, and CockroachDB vector index without account or cluster identifiers.</desc>

  <rect width="1920" height="1080" fill="#f4f1e8"/>

  <g transform="translate(78 54)">
    <circle cx="30" cy="30" r="30" fill="#405a4c"/>
    <text x="30" y="32" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="30">S</text>
    <text x="78" y="34" dominant-baseline="middle" fill="#1f231f" font-family="Inter, Segoe UI, sans-serif" font-size="31" font-weight="750">ScopeThread</text>
  </g>

  <g transform="translate(1544 60)">
    <rect width="296" height="52" rx="26" fill="#faf8f2" stroke="#cec7b8" stroke-width="2"/>
    <circle cx="28" cy="26" r="7" fill="#4f765f"/>
    <text x="48" y="27" dominant-baseline="middle" fill="#405a4c" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="750" letter-spacing="1.2">READ-ONLY MCP AUDIT</text>
  </g>

  <text x="96" y="188" fill="#80643a" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="750" letter-spacing="4">VERIFIED DURABLE MEMORY</text>
  <text x="96" y="260" fill="#20231f" font-family="Georgia, Times New Roman, serif" font-size="64">The same decision chain, independently audited.</text>
  <text x="96" y="314" fill="#4f554f" font-family="Inter, Segoe UI, sans-serif" font-size="25">Single-cluster OAuth access · allowlisted queries · no write operations</text>

  <g transform="translate(96 366)">
    <rect width="1728" height="158" rx="28" fill="#405a4c"/>
    <text x="42" y="43" fill="#dce6de" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="750" letter-spacing="2.2">AGENT RUN</text>
    <text x="42" y="92" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="29" font-weight="700">738cf3ad-8bd4-4c3f-ba31-9330e4792a36</text>
    <g transform="translate(1329 42)">
      <rect width="337" height="76" rx="20" fill="#557461"/>
      <circle cx="38" cy="38" r="18" fill="#e9f2eb"/>
      <path d="M29 38 L36 45 L48 31" fill="none" stroke="#405a4c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="40" dominant-baseline="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="750">SUCCEEDED</text>
    </g>
  </g>

  <g transform="translate(96 568)">
    <rect width="770" height="272" rx="28" fill="#faf8f2" stroke="#d3cdbf" stroke-width="2"/>
    <text x="38" y="47" fill="#80643a" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="750" letter-spacing="2.2">DECISION REVISION</text>

    <g transform="translate(38 82)">
      <rect width="278" height="86" rx="18" fill="#eee9df"/>
      <text x="22" y="31" fill="#6b6e68" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">PRIOR DECISION</text>
      <text x="22" y="63" fill="#2c302c" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="750">SUPERSEDED</text>
    </g>

    <g transform="translate(333 92)">
      <text x="64" y="20" text-anchor="middle" fill="#80643a" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="750">SUPERSEDES</text>
      <path d="M0 52 H116" fill="none" stroke="#80643a" stroke-width="4"/>
      <path d="M116 52 L96 40 V64 Z" fill="#80643a"/>
    </g>

    <g transform="translate(482 82)">
      <rect width="250" height="86" rx="18" fill="#dfe9e1"/>
      <text x="22" y="31" fill="#4f6557" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">REPLACEMENT</text>
      <text x="22" y="63" fill="#315040" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="750">ACTIVE</text>
    </g>

    <text x="38" y="212" fill="#6b6e68" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700">REVISION REASON</text>
    <text x="38" y="242" fill="#323632" font-family="Inter, Segoe UI, sans-serif" font-size="18">The client approved online booking after revising the launch scope.</text>
  </g>

  <g transform="translate(902 568)">
    <rect width="922" height="272" rx="28" fill="#faf8f2" stroke="#d3cdbf" stroke-width="2"/>
    <text x="38" y="47" fill="#80643a" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="750" letter-spacing="2.2">COCKROACHDB EVIDENCE</text>

    <g transform="translate(38 79)">
      <rect width="846" height="72" rx="18" fill="#edf0e8"/>
      <text x="24" y="27" fill="#637065" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">VECTOR INDEX</text>
      <text x="24" y="54" fill="#2f4136" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="750">memory_items_embedding_idx</text>
      <text x="822" y="42" text-anchor="end" fill="#4e6657" font-family="Inter, Segoe UI, sans-serif" font-size="17">project_id · embedding · id</text>
    </g>

    <g transform="translate(38 172)">
      <rect width="258" height="62" rx="16" fill="#eee9df"/>
      <text x="22" y="38" fill="#5f625d" font-family="Inter, Segoe UI, sans-serif" font-size="18"><tspan font-weight="750">3</tspan> SELECT queries</text>
      <rect x="316" width="258" height="62" rx="16" fill="#eee9df"/>
      <text x="338" y="38" fill="#5f625d" font-family="Inter, Segoe UI, sans-serif" font-size="18"><tspan font-weight="750">1</tspan> SHOW statement</text>
      <rect x="594" width="252" height="62" rx="16" fill="#dfe9e1"/>
      <text x="616" y="38" fill="#315040" font-family="Inter, Segoe UI, sans-serif" font-size="18"><tspan font-weight="750">0</tspan> write operations</text>
    </g>
  </g>

  <g transform="translate(96 891)">
    <rect width="1728" height="104" rx="24" fill="#e8e2d6"/>
    <text x="34" y="38" fill="#80643a" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="750" letter-spacing="2">AUDIT BOUNDARY</text>
    <text x="34" y="72" fill="#4a4f49" font-family="Inter, Segoe UI, sans-serif" font-size="21">Only allowlisted result columns are shown. No account ID, cluster ID, OAuth token, database URL, or client text is present.</text>
  </g>

  <text x="96" y="1041" fill="#676b65" font-family="Inter, Segoe UI, sans-serif" font-size="16">Verified 2026-08-07 · CockroachDB Cloud Managed MCP · fictional demo data</text>
</svg>
