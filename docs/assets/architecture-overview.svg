<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">ScopeThread agentic memory architecture</title>
  <desc id="description">A public browser uses an AWS agent workflow with Amazon Bedrock and CockroachDB durable memory. A separate read-only Managed MCP connection audits the same memory.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#393025" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#3f5648"/>
    </marker>
    <marker id="arrow-brown" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#8b6f47"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#f3f1ea"/>
  <circle cx="108" cy="84" r="30" fill="#3f5648"/>
  <text x="108" y="95" text-anchor="middle" fill="#f7f5ef" font-family="Georgia, serif" font-size="32">S</text>
  <text x="156" y="94" fill="#20231f" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6">ScopeThread</text>
  <rect x="1617" y="59" width="195" height="50" rx="25" fill="#faf8f2" stroke="#c9c2b5" stroke-width="2"/>
  <text x="1715" y="91" text-anchor="middle" fill="#526658" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="700">LIVE ARCHITECTURE</text>

  <text x="96" y="188" fill="#6f5c40" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="750" letter-spacing="3">AGENTIC MEMORY FLOW</text>
  <text x="96" y="260" fill="#20231f" font-family="Georgia, Times New Roman, serif" font-size="66" letter-spacing="-2.2">Keep every client decision connected.</text>
  <text x="96" y="310" fill="#595b55" font-family="Inter, Segoe UI, sans-serif" font-size="26">AWS runs the agent. CockroachDB preserves the evidence, state, vectors, and revision history.</text>

  <g filter="url(#shadow)">
    <rect x="96" y="405" width="310" height="242" rx="24" fill="#faf8f2" stroke="#d5d0c5" stroke-width="2"/>
    <circle cx="152" cy="463" r="24" fill="#e9f0e8"/>
    <path d="M141 453 H163 V469 H141 Z M145 474 H159" fill="none" stroke="#3f5648" stroke-width="3" stroke-linecap="round"/>
    <text x="190" y="472" fill="#20231f" font-family="Georgia, Times New Roman, serif" font-size="34">Public browser</text>
    <text x="136" y="533" fill="#526658" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="750">ENGLISH + JAPANESE</text>
    <text x="136" y="574" fill="#595b55" font-family="Inter, Segoe UI, sans-serif" font-size="22">Conversation evidence</text>
    <text x="136" y="608" fill="#595b55" font-family="Inter, Segoe UI, sans-serif" font-size="22">Revision confirmation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="542" y="375" width="492" height="302" rx="24" fill="#faf8f2" stroke="#d5d0c5" stroke-width="2"/>
    <text x="590" y="435" fill="#6f5c40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="750" letter-spacing="2.5">AWS AGENT WORKFLOW</text>
    <text x="590" y="488" fill="#20231f" font-family="Georgia, Times New Roman, serif" font-size="39">API Gateway + Lambda</text>
    <rect x="590" y="529" width="396" height="94" rx="16" fill="#f1f2ea"/>
    <circle cx="632" cy="576" r="18" fill="#3f5648"/>
    <path d="M626 576 L631 581 L640 570" fill="none" stroke="#f7f5ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="668" y="569" fill="#20231f" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Amazon Bedrock</text>
    <text x="668" y="598" fill="#595b55" font-family="Inter, Segoe UI, sans-serif" font-size="18">Nova reasoning + multilingual embeddings</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1170" y="345" width="650" height="400" rx="28" fill="#3f5648"/>
    <text x="1222" y="414" fill="#dce7de" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="750" letter-spacing="2.5">DURABLE MEMORY LAYER</text>
    <text x="1222" y="472" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="43">CockroachDB Cloud</text>
    <line x1="1222" y1="507" x2="1768" y2="507" stroke="#70877a" stroke-width="2"/>

    <g font-family="Inter, Segoe UI, sans-serif">
      <rect x="1222" y="546" width="245" height="65" rx="14" fill="#526b5a"/>
      <text x="1248" y="587" fill="#ffffff" font-size="18" font-weight="700">Evidence + source quotes</text>
      <rect x="1490" y="546" width="278" height="65" rx="14" fill="#526b5a"/>
      <text x="1518" y="587" fill="#ffffff" font-size="21" font-weight="700">Active decision state</text>
      <rect x="1222" y="630" width="245" height="65" rx="14" fill="#526b5a"/>
      <text x="1250" y="671" fill="#ffffff" font-size="21" font-weight="700">Vector index</text>
      <rect x="1490" y="630" width="278" height="65" rx="14" fill="#526b5a"/>
      <text x="1518" y="671" fill="#ffffff" font-size="21" font-weight="700">Supersedes links</text>
    </g>
  </g>

  <path d="M406 526 H520" fill="none" stroke="#3f5648" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="463" y="505" text-anchor="middle" fill="#526658" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">HTTPS</text>
  <path d="M1034 526 H1148" fill="none" stroke="#3f5648" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="1091" y="505" text-anchor="middle" fill="#526658" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">READ + WRITE</text>

  <g filter="url(#shadow)">
    <rect x="542" y="790" width="492" height="174" rx="24" fill="#faf8f2" stroke="#c9c2b5" stroke-width="2"/>
    <rect x="572" y="821" width="120" height="34" rx="17" fill="#f4eee2"/>
    <text x="632" y="844" text-anchor="middle" fill="#725d3e" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="750">READ ONLY</text>
    <text x="572" y="898" fill="#20231f" font-family="Georgia, Times New Roman, serif" font-size="34">Managed MCP audit</text>
    <text x="572" y="932" fill="#595b55" font-family="Inter, Segoe UI, sans-serif" font-size="19">OAuth · single cluster · allowlisted queries</text>
  </g>

  <path d="M1034 877 H1462 V768" fill="none" stroke="#8b6f47" stroke-width="5" marker-end="url(#arrow-brown)"/>
  <text x="1230" y="854" text-anchor="middle" fill="#725d3e" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">AUDITS THE SAME MEMORY</text>

  <text x="96" y="1018" fill="#71736c" font-family="Inter, Segoe UI, sans-serif" font-size="20">Structured truth decides what is current. Vector retrieval reconnects new evidence with the decisions that came before.</text>
</svg>
