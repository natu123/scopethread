<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ScopeThread agentic memory</title>
  <desc id="description">Keep every client decision connected with durable agentic memory built on CockroachDB and AWS.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#393025" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#486150"/>
      <stop offset="1" stop-color="#34493d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#f3f1ea"/>
  <circle cx="1090" cy="-10" r="230" fill="#e6e9df"/>
  <circle cx="1165" cy="560" r="170" fill="#eee6d8" opacity="0.75"/>

  <g transform="translate(70 58)">
    <circle cx="22" cy="22" r="22" fill="#3f5648"/>
    <text x="22" y="31" text-anchor="middle" fill="#f7f5ef" font-family="Georgia, 'Times New Roman', serif" font-size="26">S</text>
    <text x="58" y="29" fill="#20231f" font-family="Inter, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="-0.5">ScopeThread</text>
  </g>

  <text x="70" y="172" fill="#6f5c40" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="3">AGENTIC MEMORY FOR CLIENT WORK</text>
  <text x="70" y="244" fill="#20231f" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="-2.4">
    <tspan x="70">Keep every client</tspan>
    <tspan x="70" dy="62">decision connected.</tspan>
  </text>
  <text x="70" y="394" fill="#595b55" font-family="Inter, 'Segoe UI', sans-serif" font-size="22">
    <tspan x="70">Turn conversations into traceable requirements,</tspan>
    <tspan x="70" dy="34">current decisions, and durable revision history.</tspan>
  </text>

  <g transform="translate(735 142)" filter="url(#shadow)">
    <rect width="385" height="355" rx="26" fill="url(#memory)"/>
    <text x="34" y="48" fill="#dce7de" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">DECISION MEMORY</text>

    <g transform="translate(34 82)">
      <rect width="317" height="92" rx="16" fill="#f5f3ec" opacity="0.93"/>
      <text x="20" y="28" fill="#7a776f" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">PREVIOUS DECISION</text>
      <text x="20" y="58" fill="#565852" font-family="Georgia, 'Times New Roman', serif" font-size="19">Online booking is not required.</text>
      <text x="20" y="78" fill="#8a8983" font-family="Inter, 'Segoe UI', sans-serif" font-size="12">Superseded · evidence retained</text>
    </g>

    <path d="M192 186 V214" fill="none" stroke="#d5c69f" stroke-width="3" stroke-linecap="round"/>
    <path d="M185 207 L192 215 L199 207" fill="none" stroke="#d5c69f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="212" y="205" fill="#e9dfc4" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1">SUPERSEDES</text>

    <g transform="translate(34 226)">
      <rect width="317" height="92" rx="16" fill="#ffffff"/>
      <text x="20" y="28" fill="#526658" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">CURRENT DECISION</text>
      <text x="20" y="58" fill="#20231f" font-family="Georgia, 'Times New Roman', serif" font-size="19">Add booking across the website.</text>
      <text x="20" y="78" fill="#687d6d" font-family="Inter, 'Segoe UI', sans-serif" font-size="12">Active · grounded in client evidence</text>
    </g>
  </g>

  <g transform="translate(70 538)" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700">
    <rect width="150" height="40" rx="20" fill="#faf8f2" stroke="#c9c2b5"/>
    <text x="75" y="26" text-anchor="middle" fill="#3f5648">CockroachDB</text>
    <rect x="164" width="84" height="40" rx="20" fill="#faf8f2" stroke="#c9c2b5"/>
    <text x="206" y="26" text-anchor="middle" fill="#725d3e">AWS</text>
    <text x="268" y="26" fill="#71736c" font-weight="500">Relational truth + vector recall</text>
  </g>
</svg>
