AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ScopeThread hackathon MVP infrastructure.

Parameters:
  DatabaseUrlParameterName:
    Type: String
    Default: /scopethread/prod/database-url
  BedrockChatModelId:
    Type: String
    Default: global.amazon.nova-2-lite-v1:0
  BedrockEmbeddingModelId:
    Type: String
    Default: cohere.embed-multilingual-v3
  DemoTemplateMemoryId:
    Type: String
    Default: 10000000-0000-4000-8000-000000000004
  DemoSessionTtlMinutes:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 1440
  DemoSessionMaxAnalyses:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 50

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        DATABASE_URL_PARAMETER_NAME: !Ref DatabaseUrlParameterName
        BEDROCK_CHAT_MODEL_ID: !Ref BedrockChatModelId
        BEDROCK_EMBEDDING_MODEL_ID: !Ref BedrockEmbeddingModelId
        DEMO_TEMPLATE_MEMORY_ID: !Ref DemoTemplateMemoryId
        DEMO_SESSION_TTL_MINUTES: !Ref DemoSessionTtlMinutes
        DEMO_SESSION_MAX_ANALYSES: !Ref DemoSessionMaxAnalyses

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowHeaders:
          - authorization
          - content-type
          - x-idempotency-key
        AllowMethods:
          - GET
          - POST
        AllowOrigins:
          - "*"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 4
        ThrottlingRateLimit: 2
      RouteSettings:
        "POST /sessions":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5
        "POST /analyze":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: apps/api/src/handler.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health
        CreateSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /sessions
        InspectMemory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /memory
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /analyze
        ConfirmRevision:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /revisions
        DismissConflict:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /conflicts/dismiss
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/cohere.embed-multilingual-v3"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.amazon.nova-2-lite-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - apps/api/src/handler.ts
        Format: cjs
        Minify: true
        OutExtension:
          - .js=.cjs
        Sourcemap: true
        Target: es2023

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 14

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: WebBucketOrigin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: WebBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

Outputs:
  ApiUrl:
    Description: ScopeThread HTTP API URL.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  WebBucketName:
    Description: S3 bucket for the built web application.
    Value: !Ref WebBucket
  DistributionDomainName:
    Description: Public CloudFront domain for ScopeThread.
    Value: !GetAtt WebDistribution.DomainName
